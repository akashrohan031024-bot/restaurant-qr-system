<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Floor Plan - Hotel Triveni POS</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: #0A0D12;
      background-image: 
        radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.06) 0px, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      color: #fff;
      padding: 24px 32px;
      min-height: 100vh;
      position: relative;
    }

    /* Ambient Hotel Triveni Watermark Emblem */
    body::before {
      content: '🪷';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 260px;
      opacity: 0.025;
      pointer-events: none;
      z-index: 0;
      user-select: none;
    }

    .container-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Top Header Bar */
    .top-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 20px;
      padding: 16px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #0e1116;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
      border: 1px solid #fde68a;
    }

    .brand-info h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pure-veg-tag {
      font-size: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .brand-info p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .metric-badge {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 12px;
      text-align: right;
    }
    .metric-badge .val { font-size: 16px; font-weight: 800; color: #f59e0b; }
    .metric-badge .lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }

    /* Tables Layout Grid */
    .layout-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }

    .table-pod {
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid #30363d;
      border-radius: 22px;
      padding: 22px;
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .table-pod:hover {
      transform: translateY(-3px);
      border-color: rgba(245, 158, 11, 0.4);
    }

    .table-pod.occupied { border-color: #3b82f6; box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15); }
    .table-pod.calling { border-color: #f59e0b; animation: ring 1s infinite alternate; }
    .table-pod.bill-alert { border-color: #ef4444; animation: billGlow 0.8s infinite alternate; }
    .table-pod.cash-alert { border-color: #10b981; animation: cashGlow 0.8s infinite alternate; }
    .table-pod.paid { border-color: #10b981; }

    @keyframes ring { from { box-shadow: 0 0 2px #f59e0b; } to { box-shadow: 0 0 20px #f59e0b; } }
    @keyframes billGlow { from { box-shadow: 0 0 4px #ef4444; } to { box-shadow: 0 0 24px #ef4444; } }
    @keyframes cashGlow { from { box-shadow: 0 0 4px #10b981; } to { box-shadow: 0 0 24px #10b981; } }

    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .badge-free { background: rgba(30, 41, 59, 0.8); color: #94a3b8; border: 1px solid #334155; }
    .badge-occupied { background: rgba(30, 58, 138, 0.6); color: #93c5fd; border: 1px solid #3b82f6; }
    .badge-calling { background: rgba(120, 53, 15, 0.7); color: #fde68a; border: 1px solid #f59e0b; }
    .badge-bill { background: rgba(127, 29, 29, 0.7); color: #fca5a5; border: 1px solid #ef4444; }
    .badge-cash { background: rgba(6, 78, 59, 0.7); color: #6ee7b7; border: 1px solid #10b981; }
    .badge-paid { background: rgba(6, 78, 59, 0.7); color: #6ee7b7; border: 1px solid #10b981; }

    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.96); }

    /* Staff Notification Banner */
    #staff-notification-banner {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      background: linear-gradient(135deg, #b45309, #d97706);
      color: #fff;
      padding: 14px 22px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      gap: 12px;
      border: 1px solid #fde68a;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideIn {
      from { transform: translateX(110%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Floating Audio Alert Banner -->
  <div id="staff-notification-banner">
    <span style="font-size: 20px;">🔔</span>
    <span id="bannerText">Notification</span>
  </div>

  <div class="container-wrapper">
    <!-- Header with Hotel Triveni Brand Logo -->
    <header class="top-stats">
      <div class="brand-group">
        <div class="brand-logo">
          <i class="fa-solid fa-spa"></i>
        </div>
        <div class="brand-info">
          <h1>
            HOTEL TRIVENI
            <span class="pure-veg-tag"><i class="fa-solid fa-leaf"></i> 100% Pure Veg</span>
          </h1>
          <p>Floor Management & Live Billing Station • Chamarajanagar</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="metric-badge">
          <div class="val" id="activeTablesCount">0 / 6</div>
          <div class="lbl">Active Tables</div>
        </div>
        <div class="metric-badge">
          <div class="val" id="activeRevenue">₹0.00</div>
          <div class="lbl">Live Open Tabs</div>
        </div>
        <button onclick="enableAudioPlayback()" id="audioEnableBtn" style="background: rgba(30,41,59,0.8); color: #38bdf8; border: 1px solid #38bdf8; padding: 10px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 12px;">
          <i class="fa-solid fa-volume-high"></i> Audio Active
        </button>
      </div>
    </header>

    <!-- Floor Plan Layout Grid -->
    <div class="layout-grid" id="tablesContainer"></div>

    <!-- Operational Expenses Card -->
    <div style="background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.2); border-radius: 20px; padding: 22px; margin-top: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px;">
        <h3 style="font-size: 15px; color:#f59e0b; font-weight: 700; display:flex; align-items:center; gap:8px;">
          <i class="fa-solid fa-receipt"></i> Quick Log Operational Expense (Syncs to Google Sheets)
        </h3>
        <span style="font-size: 11px; color:#94a3b8;">Direct P&L Ledger Sync</span>
      </div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <select id="expCategory" style="background:#0e1116; color:#fff; border:1px solid #334155; padding:10px 14px; border-radius:10px; font-size:13px;">
          <option value="Dairy & Groceries">Dairy & Groceries (Milk, Paneer, Curd)</option>
          <option value="Electricity & LPG">Electricity & LPG (Commercial Cylinder)</option>
          <option value="Ingredients">Ingredients (Vegetables & Mandi)</option>
          <option value="Staff Salaries">Staff Salaries (Kitchen & Service Staff Daily Wages)</option>
          <option value="Maintenance">Maintenance & Misc</option>
        </select>
        <input type="text" id="expDesc" placeholder="Description (e.g. 10L Milk & Mandi Greens)" style="background:#0e1116; color:#fff; border:1px solid #334155; padding:10px 14px; border-radius:10px; flex:1; min-width: 220px; font-size:13px;">
        <input type="number" id="expAmount" placeholder="Amount (₹)" style="background:#0e1116; color:#fff; border:1px solid #334155; padding:10px 14px; border-radius:10px; width:130px; font-size:13px;">
        <button onclick="submitExpense()" class="btn" style="background:#ef4444; color:#fff; padding:10px 20px;">
          <i class="fa-solid fa-plus"></i> Save Expense
        </button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    function playNotificationChime(type = 'bill') {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'cash') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440.00, now);
          osc.frequency.setValueAtTime(554.37, now + 0.15);
          osc.frequency.setValueAtTime(659.25, now + 0.30);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 1.0);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 1.0);
        } else if (type === 'bill') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.setValueAtTime(880.00, now + 0.18);
          osc.frequency.setValueAtTime(1046.50, now + 0.36);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 1.2);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880.00, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.8);
        }
      } catch (err) {}
    }

    function enableAudioPlayback() {
      playNotificationChime('cash');
      const btn = document.getElementById('audioEnableBtn');
      btn.innerHTML = `<i class="fa-solid fa-check"></i> Audio Active`;
      btn.style.borderColor = "#10b981";
      btn.style.color = "#10b981";
    }

    function showBanner(text, type = 'bill') {
      const banner = document.getElementById('staff-notification-banner');
      const bannerText = document.getElementById('bannerText');
      bannerText.innerText = text;

      if (type === 'cash') {
        banner.style.background = "linear-gradient(135deg, #065f46, #10b981)";
      } else if (type === 'bill') {
        banner.style.background = "linear-gradient(135deg, #b91c1c, #ef4444)";
      } else {
        banner.style.background = "linear-gradient(135deg, #b45309, #d97706)";
      }
      banner.style.display = 'flex';

      setTimeout(() => { banner.style.display = 'none'; }, 8000);
    }

    socket.on('tables-sync', (tables) => {
      const container = document.getElementById('tablesContainer');
      container.innerHTML = '';

      let occupiedCount = 0;
      let totalLiveAmount = 0;

      Object.entries(tables).forEach(([id, t]) => {
        if (t.total > 0 || t.status === 'occupied') occupiedCount++;
        totalLiveAmount += (t.total || 0);

        const pod = document.createElement('div');
        let statusClass = t.status;
        let badgeLabel = 'Available';
        let badgeClass = 'badge-free';

        if (t.cashRequested) {
          statusClass = 'cash-alert';
          badgeLabel = '💵 Collect Cash!';
          badgeClass = 'badge-cash';
        } else if (t.billRequested) {
          statusClass = 'bill-alert';
          badgeLabel = 'Bill Requested! 🧾';
          badgeClass = 'badge-bill';
        } else if (t.waiterCalled) {
          statusClass = 'calling';
          badgeLabel = 'Calling Waiter! 🔔';
          badgeClass = 'badge-calling';
        } else if (t.paid) {
          statusClass = 'paid';
          badgeLabel = 'Paid ✓';
          badgeClass = 'badge-paid';
        } else if (t.total > 0) {
          statusClass = 'occupied';
          badgeLabel = 'Dining (Tab Open)';
          badgeClass = 'badge-occupied';
        }

        pod.className = `table-pod ${statusClass}`;
        pod.id = `table-card-${id}`;
        
        pod.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:13px; color:#f59e0b; font-weight:800;">#0${id}</span>
              <h3 style="font-size:18px; font-weight:700;">Table ${id}</h3>
            </div>
            <span class="badge ${badgeClass}">${badgeLabel}</span>
          </div>

          <div style="font-size:28px; font-weight:800; margin-bottom:6px; color: ${t.total > 0 ? '#f59e0b' : '#64748b'};">
            ₹${t.total.toFixed(2)}
          </div>
          <div style="font-size:12px; color:#94a3b8; margin-bottom:16px;">
            <i class="fa-solid fa-clock-rotate-left"></i> ${t.orders ? t.orders.length : 0} rounds placed
          </div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            ${(t.billRequested || t.cashRequested || t.total > 0) ? `
              <button class="btn" style="background:#10b981; color:#000;" onclick="openPaymentScannerModal(${id},${t.total})">
                <i class="fa-solid fa-qrcode"></i> Settle Payment (UPI / Cash)
              </button>
            ` : ''}

            ${t.waiterCalled ? `
              <button class="btn" style="background:#f59e0b; color:#000;" onclick="dismissWaiter(${id})">
                <i class="fa-solid fa-check"></i> Waiter Attended
              </button>
            ` : ''}

            ${(t.total > 0 || t.paid) ? `
              <button class="btn" style="background:#1e293b; color:#cbd5e1; border:1px solid #334155;" onclick="resetTable(${id})">
                <i class="fa-solid fa-rotate-right"></i> Clear & Reset Table
              </button>
            ` : ''}
          </div>
        `;
        container.appendChild(pod);
      });

      document.getElementById('activeTablesCount').innerText = `${occupiedCount} / 6`;
      document.getElementById('activeRevenue').innerText = `₹${totalLiveAmount.toFixed(2)}`;
    });

    socket.on('staff-alert', (alertData) => {
      const isCash = alertData.type === 'cash';
      const isBill = alertData.type === 'bill';
      playNotificationChime(isCash ? 'cash' : (isBill ? 'bill' : 'waiter'));
      showBanner(alertData.message, alertData.type);
    });

    function dismissWaiter(id) { socket.emit('dismiss-waiter', { tableId: id }); }
    
    function resetTable(id) { 
      if (confirm(`Reset Table ${id}? This will clear open orders.`)) {
        socket.emit('reset-table', { tableId: id }); 
      }
    }

    function openPaymentScannerModal(tableId, totalAmount) {
      if (!totalAmount || totalAmount <= 0) {
        alert("Table balance is ₹0.00.");
        return;
      }

      const upiId = "hotel.triveni@upi"; 
      const payeeName = "Hotel Triveni";
      const grandTotalWithGst = (totalAmount * 1.05).toFixed(2);
      const note = `Table ${tableId} Pure Veg Dining`;
      
      const upiString = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(payeeName)}&am=${grandTotalWithGst}&cu=INR&tn=${encodeURIComponent(note)}`;
      const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiString)}`;

      const modalHtml = `
        <div id="paymentModal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 16px;">
          <div style="background: #161b22; border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 24px; padding: 26px; max-width: 360px; width: 100%; text-align: center; color: #fff; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">
            <div style="display:inline-block; font-size: 10px; text-transform: uppercase; color: #10b981; font-weight: 800; letter-spacing: 1px; background:rgba(16,185,129,0.15); padding:3px 10px; border-radius:20px; border:1px solid rgba(16,185,129,0.3); margin-bottom:8px;">
              Hotel Triveni Settlement
            </div>
            <h3 style="font-size: 19px; font-weight: 700; margin-bottom: 2px;">Table ${tableId} Bill</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 14px;">Customer scans with PhonePe, GPay, or Paytm</p>
            
            <div style="background: #fff; padding: 12px; border-radius: 16px; display: inline-block; margin-bottom: 12px; border: 2px solid #f59e0b;">
              <img src="${qrCodeUrl}" alt="Scan to Pay" style="width: 200px; height: 200px; display: block;" />
            </div>

            <div style="font-size: 26px; font-weight: 800; color: #10b981; margin-bottom: 2px;">₹${grandTotalWithGst}</div>
            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 8px;">(Includes 5% Pure Veg Dining GST)</div>
            <div style="font-size: 12px; color: #e2e8f0; margin-bottom: 18px;">UPI ID: <b style="color: #f59e0b;">${upiId}</b></div>

            <div style="display: flex; gap: 8px;">
              <button onclick="confirmPaymentReceived(${tableId}, 'UPI')" class="btn" style="flex: 1; background: #10b981; color: #000;">
                <i class="fa-solid fa-check"></i> Paid UPI
              </button>
              <button onclick="confirmPaymentReceived(${tableId}, 'Cash')" class="btn" style="flex: 1; background: #f59e0b; color: #000;">
                <i class="fa-solid fa-money-bill-wave"></i> Paid Cash
              </button>
            </div>
            
            <button onclick="document.getElementById('paymentModal').remove()" style="margin-top: 10px; width: 100%; background: #21262d; color: #94a3b8; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-size: 12px;">
              Close Window
            </button>
          </div>
        </div>
      `;

      const existing = document.getElementById('paymentModal');
      if (existing) existing.remove();
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function confirmPaymentReceived(tableId, method) {
      socket.emit('pay-bill', { tableId: tableId, method: method });
      alert(`Table ${tableId} settled via ${method}! Entry synced to Google Sheet.`);
      const modal = document.getElementById('paymentModal');
      if (modal) modal.remove();
    }

    function submitExpense() {
      const category = document.getElementById('expCategory').value;
      const desc = document.getElementById('expDesc').value;
      const amt = document.getElementById('expAmount').value;

      if (!amt || !desc) {
        alert("Please enter description and amount.");
        return;
      }

      socket.emit('log-expense', { category, description: desc, amount: parseFloat(amt) });
      document.getElementById('expDesc').value = '';
      document.getElementById('expAmount').value = '';
      alert("Operational expense submitted to Google Sheet!");
    }
  </script>
</body>
</html>
