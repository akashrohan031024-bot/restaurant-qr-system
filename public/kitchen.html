<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kitchen Display Screen (KDS) - Hotel Triveni</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: #08090B;
      background-image: 
        radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      color: #fff;
      padding: 24px 32px;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '👨‍🍳';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 260px;
      opacity: 0.02;
      pointer-events: none;
      z-index: 0;
      user-select: none;
    }

    .container-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
    }

    .kds-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 20px;
      padding: 16px 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #0e1116;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
      border: 1px solid #fde68a;
    }

    .brand-info h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .kds-tag {
      font-size: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .brand-info p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .metric-badge {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 12px;
      text-align: right;
    }
    .metric-badge .val { font-size: 16px; font-weight: 800; color: #10b981; }
    .metric-badge .lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }

    .ticket-feed {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 20px;
    }

    .ticket {
      background: rgba(22, 27, 34, 0.9);
      backdrop-filter: blur(12px);
      border-top: 6px solid #10b981;
      border-left: 1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.3s;
      position: relative;
    }

    .ticket.modified {
      border: 3px dashed #ef4444 !important;
      animation: kdsPulse 1s infinite alternate;
    }
    @keyframes kdsPulse {
      from { box-shadow: 0 0 4px #ef4444; }
      to { box-shadow: 0 0 24px #ef4444; }
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 800;
      border-bottom: 1px dashed rgba(255,255,255,0.12);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .ticket-header .order-num {
      font-family: monospace;
      color: #94a3b8;
      font-size: 15px;
    }

    .ticket-header .table-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .ticket-time {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-line {
      font-size: 15px;
      margin: 10px 0;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .item-badge {
      background: #f59e0b;
      color: #000;
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
    }

    .done-btn {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #10b981;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .done-btn:hover {
      background: #10b981;
      color: #000;
    }

    #kds-modification-alert {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #b91c1c, #ef4444);
      color: #fff;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 15px;
      z-index: 99999;
      box-shadow: 0 10px 40px rgba(220,38,38,0.8);
      border: 2px solid #fecaca;
      text-align: center;
      display: none;
      animation: dropDown 0.3s ease-out;
    }
    @keyframes dropDown {
      from { transform: translate(-50%, -100%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="kds-modification-alert"></div>

  <div class="container-wrapper">
    <header class="kds-header">
      <div class="brand-group">
        <div class="brand-logo">
          <i class="fa-solid fa-utensils"></i>
        </div>
        <div class="brand-info">
          <h1>
            HOTEL TRIVENI
            <span class="kds-tag"><i class="fa-solid fa-fire"></i> Live KDS</span>
          </h1>
          <p>Real-Time Kitchen Order Preparation System</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="metric-badge">
          <div class="val" id="ticketCount">0</div>
          <div class="lbl">Pending Tickets</div>
        </div>
        <button onclick="enableAudio()" id="audioBtn" style="background: rgba(30,41,59,0.8); color: #10b981; border: 1px solid #10b981; padding: 10px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 12px;">
          <i class="fa-solid fa-bell"></i> Kitchen Chime Active
        </button>
      </div>
    </header>

    <div class="ticket-feed" id="tickets"></div>
  </div>

  <script>
    const socket = io();
    let totalTickets = 0;
    const existingTicketIds = new Set();

    function playChime(isWarning = false) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (isWarning) {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.setValueAtTime(700, now + 0.12);
          osc.frequency.setValueAtTime(350, now + 0.24);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.7);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.setValueAtTime(987.77, now + 0.18);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.9);
        }
      } catch(e) {}
    }

    function enableAudio() {
      playChime(false);
      document.getElementById('audioBtn').innerHTML = `<i class="fa-solid fa-check"></i> Chime Ready`;
    }

    function renderOrderCard(order, playSound = true) {
      if (!order) return;
      const cleanId = order.orderId ? String(order.orderId).replace('#', '') : Math.floor(Math.random() * 1000);
      
      // Strict deduplication guard
      if (existingTicketIds.has(cleanId) || document.getElementById(`ticket-${cleanId}`)) {
        return;
      }
      existingTicketIds.add(cleanId);

      if (playSound) playChime(false);

      totalTickets++;
      document.getElementById('ticketCount').innerText = totalTickets;

      const container = document.getElementById('tickets');
      const card = document.createElement('div');
      card.className = 'ticket';
      card.id = `ticket-${cleanId}`;
      card.dataset.table = order.table || `Table ${order.tableId}`;

      card.innerHTML = `
        <div class="ticket-header">
          <span class="order-num">${order.orderId || '#' + cleanId}</span>
          <span class="table-badge">${order.table || 'Table ' + order.tableId}</span>
        </div>
        <div class="ticket-time">
          <i class="fa-regular fa-clock"></i> Round ${order.round || 1} • Placed at ${order.time}
        </div>
        <div class="items-list">
          ${(order.items || []).map(i => `
            <div class="item-line">
              <span>${i.name}</span>
              <span class="item-badge">${i.qty || 1}x</span>
            </div>
          `).join('')}
        </div>
        <button class="done-btn" onclick="dismissTicket('ticket-${cleanId}', '${cleanId}')">
          <i class="fa-solid fa-circle-check"></i> Mark Prepared
        </button>
      `;
      container.prepend(card);
    }

    // Only listen to the single canonical event
    socket.on('new-kitchen-order', (order) => {
      renderOrderCard(order, true);
    });

    function dismissTicket(elementId, cleanId) {
      const ticket = document.getElementById(elementId);
      if (ticket) {
        ticket.style.opacity = '0';
        ticket.style.transform = 'scale(0.9)';
        setTimeout(() => {
          ticket.remove();
          existingTicketIds.delete(cleanId);
          totalTickets = Math.max(0, totalTickets - 1);
          document.getElementById('ticketCount').innerText = totalTickets;
        }, 200);
      }
    }

    socket.on('kitchen-order-modified', (mod) => {
      playChime(true);

      const alertBar = document.getElementById('kds-modification-alert');
      alertBar.innerHTML = `⚠️ ATTENTION: ${mod.table} changed <u>${mod.itemName}</u> (${mod.oldQty}x ➔ ${mod.newQty}x)!`;
      alertBar.style.display = 'block';

      document.querySelectorAll('.ticket').forEach(card => {
        if (card.dataset.table === mod.table || card.innerText.includes(mod.table)) {
          card.classList.add('modified');

          const notice = document.createElement('div');
          notice.style = "background: #7f1d1d; color: #fecaca; padding: 6px 10px; border-radius: 8px; font-weight: bold; margin-top: 10px; font-size: 12px; border: 1px solid #ef4444;";
          notice.innerHTML = `⚠️ MODIFIED: ${mod.itemName} changed to ${mod.newQty}x`;
          card.appendChild(notice);
        }
      });

      setTimeout(() => {
        alertBar.style.display = 'none';
      }, 10000);
    });
  </script>
</body>
</html>
